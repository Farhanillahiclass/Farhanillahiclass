<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
<title id="title">GYRUS — animated AI command and tool-routing system</title>
<desc id="desc">A voice or text command enters the intent classifier, routes to YouTube, files, research, system, study or communication tools, passes through the selected AI brain, and returns a dashboard and spoken response. Cloud providers are optional; the configured provider determines data flow.</desc>
<defs><linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070d1b"/><stop offset="1" stop-color="#1b1740"/></linearGradient><radialGradient id="g-core"><stop stop-color="#c4b5fd" stop-opacity=".9"/><stop offset="1" stop-color="#7c3aed" stop-opacity=".12"/></radialGradient><filter id="g-glow"><feGaussianBlur stdDeviation="4"/></filter></defs>
<style>
.t{font:700 23px Arial,sans-serif;fill:#f4f7ff}.k{font:700 10px Arial,sans-serif;letter-spacing:2px;fill:#c4b5fd}.label{font:700 12px Arial,sans-serif;fill:#e8eaff}.small{font:10px Consolas,monospace;fill:#a5b4d4}.muted{font:12px Arial,sans-serif;fill:#b7c1dd}.panel{fill:#111a31;stroke:#4c4380;stroke-width:1}.wire{fill:none;stroke:#a78bfa;stroke-width:1.6;stroke-dasharray:5 7;animation:g-dash 3.5s linear infinite}.dot{fill:#e9d5ff;filter:url(#g-glow);animation:g-flow 4s linear infinite}.orbit{fill:none;stroke:#a78bfa;stroke-opacity:.65;stroke-dasharray:3 5;transform-origin:555px 155px;animation:g-spin 10s linear infinite}.core{fill:url(#g-core);stroke:#c4b5fd;stroke-width:1.2;animation:g-pulse 2.2s ease-in-out infinite}.tool{fill:#151d36;stroke:#6658a5;stroke-width:1}.bar{fill:#a78bfa;transform-box:fill-box;transform-origin:left;animation:g-bar 2.4s ease-in-out infinite alternate}@keyframes g-dash{to{stroke-dashoffset:-84}}@keyframes g-flow{0%{opacity:0;offset-distance:0%}20%{opacity:1}85%{opacity:1}100%{opacity:0;offset-distance:100%}}@keyframes g-spin{to{transform:rotate(360deg)}}@keyframes g-pulse{50%{r:28;opacity:.75}}@keyframes g-bar{to{transform:scaleX(.55)}}@media(prefers-reduced-motion:reduce){.wire,.dot,.orbit,.core,.bar{animation:none}}
</style>
<rect width="1100" height="330" rx="18" fill="url(#g-bg)"/>
<g opacity=".08" stroke="#a5b4fc"><path d="M0 60H1100M0 120H1100M0 180H1100M0 240H1100M0 300H1100M100 0V330M200 0V330M300 0V330M400 0V330M500 0V330M600 0V330M700 0V330M800 0V330M900 0V330M1000 0V330"/></g>
<text x="26" y="30" class="k">VOICE • INTENT CLASSIFIER • DESKTOP TOOL ROUTING</text><text x="26" y="62" class="t">GYRUS — AI Command Orchestration</text>
<rect x="26" y="92" width="170" height="65" rx="10" class="panel"/><text x="42" y="116" class="small">01 / INPUT</text><text x="42" y="139" class="label">Voice or Text</text>
<path d="M196 124H238" class="wire"/><circle r="4" class="dot"><animateMotion dur="2.2s" repeatCount="indefinite" path="M196 124H238"/></circle>
<rect x="240" y="92" width="190" height="65" rx="10" class="panel"/><text x="255" y="116" class="small">02 / ROUTER</text><text x="255" y="139" class="label">TF-IDF + Logistic</text>
<path d="M430 124H476" class="wire"/><circle r="4" class="dot"><animateMotion dur="2.2s" begin=".3s" repeatCount="indefinite" path="M430 124H476"/></circle>
<circle cx="555" cy="124" r="42" class="core"/><circle cx="555" cy="124" r="54" class="orbit"/><text x="555" y="119" text-anchor="middle" class="small">AI BRAIN</text><text x="555" y="137" text-anchor="middle" class="label">Local / Cloud</text>
<path d="M609 124H652" class="wire"/><circle r="4" class="dot"><animateMotion dur="2.2s" begin=".6s" repeatCount="indefinite" path="M609 124H652"/></circle>
<rect x="654" y="92" width="180" height="65" rx="10" class="panel"/><text x="669" y="116" class="small">03 / ACTION</text><text x="669" y="139" class="label">Specialized Tool</text>
<path d="M834 124H876" class="wire"/><circle r="4" class="dot"><animateMotion dur="2.2s" begin=".9s" repeatCount="indefinite" path="M834 124H876"/></circle>
<rect x="878" y="92" width="196" height="65" rx="10" class="panel"/><text x="893" y="116" class="small">04 / RESPONSE</text><text x="893" y="139" class="label">Dashboard + Voice</text>
<text x="26" y="190" class="k">TOOL ROUTES</text>
<g><rect x="26" y="205" width="160" height="40" rx="8" class="tool"/><text x="106" y="230" text-anchor="middle" class="label">YouTube / Browser</text><rect x="198" y="205" width="160" height="40" rx="8" class="tool"/><text x="278" y="230" text-anchor="middle" class="label">Files / OS</text><rect x="370" y="205" width="160" height="40" rx="8" class="tool"/><text x="450" y="230" text-anchor="middle" class="label">Tasks / Study</text><rect x="542" y="205" width="160" height="40" rx="8" class="tool"/><text x="622" y="230" text-anchor="middle" class="label">Research / OCR</text><rect x="714" y="205" width="160" height="40" rx="8" class="tool"/><text x="794" y="230" text-anchor="middle" class="label">Email / WhatsApp</text><rect x="886" y="205" width="188" height="40" rx="8" class="tool"/><text x="980" y="230" text-anchor="middle" class="label">System / Vision</text></g>
<path d="M744 157V180H106 106V205M744 180H980V205" fill="none" stroke="#7c6bc3" stroke-opacity=".45" stroke-dasharray="3 6"/>
<text x="26" y="282" class="muted">Animated architecture based on repository documentation; tool availability depends on setup and configured providers.</text><text x="26" y="307" class="small">COMMAND → CLASSIFY → ROUTE → EXECUTE → RESPOND</text><rect x=".5" y=".5" width="1099" height="329" rx="17.5" fill="none" stroke="#3a3568"/>
</svg>