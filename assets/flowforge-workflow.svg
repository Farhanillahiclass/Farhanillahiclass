<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
<title id="title">FlowForge-AI — modular n8n automation orchestration</title>
<desc id="desc">An authenticated main ingress validates a request, a dispatcher routes the event to one of twenty business automation workflows, and a central error handler receives configured errors. This diagram describes repository architecture; it does not indicate live execution.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d1c"/><stop offset="1" stop-color="#211342"/></linearGradient><linearGradient id="accent"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4"/></filter></defs>
<style>
.t{font:700 25px Arial,sans-serif;fill:#f8fafc}.k{font:700 10px Arial,sans-serif;letter-spacing:2px;fill:#c4b5fd}.label{font:700 13px Arial,sans-serif;fill:#f1f5f9}.small{font:10px Consolas,monospace;fill:#cbd5e1}.panel{fill:#111a30;stroke:#6250a2;stroke-width:1.2}.wire{fill:none;stroke:url(#accent);stroke-width:2;stroke-dasharray:6 7;animation:dash 3s linear infinite}.node{fill:#c4b5fd;filter:url(#glow);animation:pulse 2s ease-in-out infinite alternate}.child{fill:#161e36;stroke:#4f477b}.childline{stroke:#7662b7;stroke-opacity:.65;fill:none;stroke-width:1.2}@keyframes dash{to{stroke-dashoffset:-78}}@keyframes pulse{to{opacity:.35}}@media(prefers-reduced-motion:reduce){.wire,.node{animation:none}}
</style>
<rect width="1100" height="330" rx="18" fill="url(#bg)"/><g opacity=".07" stroke="#c4b5fd"><path d="M0 55H1100M0 110H1100M0 165H1100M0 220H1100M0 275H1100M100 0V330M200 0V330M300 0V330M400 0V330M500 0V330M600 0V330M700 0V330M800 0V330M900 0V330M1000 0V330"/></g>
<text x="26" y="30" class="k">N8N • EVENT-DRIVEN BUSINESS AUTOMATION • 20 CANONICAL WORKFLOWS</text><text x="26" y="62" class="t">FlowForge-AI — Modular Automation Orchestration</text>
<rect x="26" y="91" width="190" height="65" rx="10" class="panel"/><text x="42" y="116" class="small">01 / ENTRY</text><text x="42" y="140" class="label">Authenticated Ingress</text>
<path d="M216 124H260" class="wire"/><circle r="4" class="node"><animateMotion dur="2.3s" repeatCount="indefinite" path="M216 124H260"/></circle>
<rect x="262" y="91" width="190" height="65" rx="10" class="panel"/><text x="278" y="116" class="small">02 / VALIDATE</text><text x="278" y="140" class="label">Request Processor</text>
<path d="M452 124H496" class="wire"/><circle r="4" class="node"><animateMotion dur="2.3s" begin=".4s" repeatCount="indefinite" path="M452 124H496"/></circle>
<rect x="498" y="91" width="190" height="65" rx="10" class="panel"/><text x="514" y="116" class="small">03 / DISPATCH</text><text x="514" y="140" class="label">Event-Type Router</text>
<path d="M688 124H732" class="wire"/><circle r="4" class="node"><animateMotion dur="2.3s" begin=".8s" repeatCount="indefinite" path="M688 124H732"/></circle>
<rect x="734" y="91" width="180" height="65" rx="10" class="panel"/><text x="750" y="116" class="small">04 / EXECUTE</text><text x="750" y="140" class="label">Child Workflow</text>
<path d="M914 124H944V96H965" class="wire"/><rect x="967" y="79" width="107" height="94" rx="10" class="panel"/><text x="1020" y="108" text-anchor="middle" class="small">05 / OUTPUT</text><text x="1020" y="130" text-anchor="middle" class="label">Result</text><text x="1020" y="148" text-anchor="middle" class="small">+ logs</text>
<text x="26" y="194" class="k">20 BUSINESS AUTOMATION DOMAINS</text>
<g><rect x="26" y="208" width="160" height="37" rx="8" class="child"/><text x="106" y="231" text-anchor="middle" class="label">Sales &amp; CRM</text><rect x="198" y="208" width="160" height="37" rx="8" class="child"/><text x="278" y="231" text-anchor="middle" class="label">Support &amp; Inbox</text><rect x="370" y="208" width="160" height="37" rx="8" class="child"/><text x="450" y="231" text-anchor="middle" class="label">Calendar &amp; Tasks</text><rect x="542" y="208" width="160" height="37" rx="8" class="child"/><text x="622" y="231" text-anchor="middle" class="label">Content &amp; Marketing</text><rect x="714" y="208" width="160" height="37" rx="8" class="child"/><text x="794" y="231" text-anchor="middle" class="label">Reports &amp; Monitoring</text><rect x="886" y="208" width="188" height="37" rx="8" class="child"/><text x="980" y="231" text-anchor="middle" class="label">Telegram &amp; APIs</text></g>
<path d="M592 156V181H106V208M592 181H980V208" class="childline"/><rect x="26" y="264" width="1048" height="42" rx="9" fill="#15152e" stroke="#5b478d"/><text x="44" y="281" class="small">RELIABILITY LAYER</text><text x="44" y="297" class="label">Central Error Handler • Static Validation • Setup Guides • Acceptance-Test Checklist</text><text x="1074" y="321" text-anchor="end" class="small">Architecture illustration — live n8n execution not implied</text><rect x=".5" y=".5" width="1099" height="329" rx="17.5" fill="none" stroke="#4c3a79"/></svg>