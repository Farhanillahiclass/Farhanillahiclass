<title id="title">Phishing URL Detector — ML Pipeline — animated workflow</title><desc id="desc">RAW URL / CSV then 31 URL FEATURES then STANDARD SCALER then KNN (K=11) then CLASS + CONFIDENCE. Streamlit single-URL and batch-CSV dashboard. Reported held-out metrics: F1 0.878 and ROC-AUC 0.945; URL-text-only model, educational prototype.</desc>
