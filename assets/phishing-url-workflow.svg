<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
<title id="title">Phishing URL Detector — animated feature extraction and KNN classification</title>
<desc id="desc">A URL or CSV enters shared URL feature extraction for 31 numeric features, the trained scaler transforms them, a distance-weighted KNN classifier with k equals 11 predicts a class and confidence, and the Streamlit dashboard displays single or batch results. This is a URL-text-only educational detector, not a guarantee of safety.</desc>
<defs><linearGradient id="p-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#120b19"/><stop offset="1" stop-color="#271329"/></linearGradient><filter id="p-glow"><feGaussianBlur stdDeviation="3"/></filter></defs>
<style>
.t{font:700 23px Arial,sans-serif;fill:#fff5f7}.k{font:700 10px Arial,sans-serif;letter-spacing:2px;fill:#fda4af}.label{font:700 12px Arial,sans-serif;fill:#ffe4e8}.small{font:10px Consolas,monospace;fill:#d6a8b3}.muted{font:12px Arial,sans-serif;fill:#e0c0ca}.panel{fill:#241321;stroke:#85445c;stroke-width:1}.wire{fill:none;stroke:#fb7185;stroke-width:1.6;stroke-dasharray:5 7;animation:p-dash 3.1s linear infinite}.scan{stroke:#fda4af;stroke-width:2;filter:url(#p-glow);animation:p-scan 2.6s ease-in-out infinite}.feature{fill:#fb7185;transform-box:fill-box;transform-origin:left;animation:p-feature 2s ease-in-out infinite alternate}.neighbor{fill:#fda4af;animation:p-neighbor 1.7s ease-in-out infinite alternate}.safe{fill:#34d399;filter:url(#p-glow);animation:p-verdict 2s ease-in-out infinite}.warn{fill:#fb7185;filter:url(#p-glow);animation:p-verdict 2s ease-in-out infinite}@keyframes p-dash{to{stroke-dashoffset:-84}}@keyframes p-scan{0%{transform:translateX(0);opacity:.2}50%{opacity:1}100%{transform:translateX(100px);opacity:.2}}@keyframes p-feature{to{transform:scaleX(.4)}}@keyframes p-neighbor{to{opacity:.3}}@keyframes p-verdict{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.wire,.scan,.feature,.neighbor,.safe,.warn{animation:none}}
</style>
<rect width="1100" height="330" rx="18" fill="url(#p-bg)"/><g opacity=".08" stroke="#fda4af"><path d="M0 60H1100M0 120H1100M0 180H1100M0 240H1100M0 300H1100M100 0V330M200 0V330M300 0V330M400 0V330M500 0V330M600 0V330M700 0V330M800 0V330M900 0V330M1000 0V330"/></g>
<text x="26" y="30" class="k">URL TEXT FEATURES • STANDARDIZED INPUT • KNN</text><text x="26" y="62" class="t">Phishing URL Detector — ML Inspection Pipeline</text>
<rect x="26" y="91" width="180" height="70" rx="10" class="panel"/><text x="42" y="116" class="small">01 / INGEST</text><text x="42" y="140" class="label">URL or CSV Batch</text>
<path d="M206 126H240" class="wire"/>
<rect x="242" y="91" width="190" height="70" rx="10" class="panel"/><text x="258" y="116" class="small">02 / EXTRACT</text><text x="258" y="140" class="label">31 Numeric Features</text><path d="M257 151H414" stroke="#6b3448" stroke-width="3"/><path d="M257 151H344" class="scan"/>
<path d="M432 126H466" class="wire"/>
<rect x="468" y="91" width="160" height="70" rx="10" class="panel"/><text x="484" y="116" class="small">03 / SCALE</text><text x="484" y="140" class="label">StandardScaler</text>
<path d="M628 126H662" class="wire"/>
<rect x="664" y="91" width="170" height="70" rx="10" class="panel"/><text x="680" y="116" class="small">04 / CLASSIFY</text><text x="680" y="140" class="label">KNN — k = 11</text><g><circle cx="690" cy="151" r="3" class="neighbor"/><circle cx="704" cy="151" r="3" class="neighbor"/><circle cx="718" cy="151" r="3" class="neighbor"/><circle cx="732" cy="151" r="3" class="neighbor"/><circle cx="746" cy="151" r="3" class="neighbor"/><circle cx="760" cy="151" r="3" class="neighbor"/><circle cx="774" cy="151" r="3" class="neighbor"/><circle cx="788" cy="151" r="3" class="neighbor"/><circle cx="802" cy="151" r="3" class="neighbor"/><circle cx="816" cy="151" r="3" class="neighbor"/><circle cx="830" cy="151" r="3" class="neighbor"/></g>
<path d="M834 126H868" class="wire"/>
<rect x="870" y="91" width="204" height="70" rx="10" class="panel"/><text x="886" y="116" class="small">05 / RESULT</text><circle cx="894" cy="140" r="5" class="safe"/><text x="907" y="144" class="label">Class + Confidence</text>
<text x="26" y="198" class="k">FEATURE SIGNALS</text><g><text x="26" y="224" class="small">URL LENGTH</text><rect x="130" y="213" width="180" height="9" rx="4" fill="#4a2537"/><rect x="130" y="213" width="135" height="9" rx="4" class="feature"/><text x="26" y="250" class="small">HOST / PATH</text><rect x="130" y="239" width="180" height="9" rx="4" fill="#4a2537"/><rect x="130" y="239" width="95" height="9" rx="4" class="feature" style="animation-delay:.4s"/><text x="26" y="276" class="small">KEYWORDS</text><rect x="130" y="265" width="180" height="9" rx="4" fill="#4a2537"/><rect x="130" y="265" width="155" height="9" rx="4" class="feature" style="animation-delay:.8s"/></g>
<text x="360" y="218" class="muted">Reported held-out evaluation:</text><text x="360" y="245" class="label">F1 0.878</text><text x="500" y="245" class="label">ROC-AUC 0.945</text><text x="360" y="271" class="muted">Streamlit: single URL + batch CSV</text><text x="360" y="296" class="small">URL TEXT ONLY • educational detector • verify suspicious links independently</text><rect x=".5" y=".5" width="1099" height="329" rx="17.5" fill="none" stroke="#73384f"/>
</svg>