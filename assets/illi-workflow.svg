<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
<title id="title">ILLI OS — animated desktop assistant and neural HUD</title>
<desc id="desc">A desktop command enters ILLI's Tkinter interface, optional speech recognition converts voice to text, the assistant routes supported commands to system and application utilities, then returns a GUI or spoken response. The rotating particle globe and telemetry bars are illustrative design elements.</desc>
<defs><linearGradient id="i-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06131e"/><stop offset="1" stop-color="#102d3c"/></linearGradient><radialGradient id="i-globe"><stop stop-color="#67e8f9" stop-opacity=".2"/><stop offset=".7" stop-color="#0891b2" stop-opacity=".07"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".01"/></radialGradient><filter id="i-glow"><feGaussianBlur stdDeviation="3"/></filter></defs>
<style>
.t{font:700 23px Arial,sans-serif;fill:#f2fbff}.k{font:700 10px Arial,sans-serif;letter-spacing:2px;fill:#67e8f9}.label{font:700 12px Arial,sans-serif;fill:#e2faff}.small{font:10px Consolas,monospace;fill:#9dc5d3}.muted{font:12px Arial,sans-serif;fill:#b4d1dc}.panel{fill:#0c202c;stroke:#216078;stroke-width:1}.wire{fill:none;stroke:#22d3ee;stroke-width:1.5;stroke-dasharray:5 7;animation:i-dash 3.2s linear infinite}.particle{fill:#a5f3fc;filter:url(#i-glow);animation:i-blink 1.8s ease-in-out infinite alternate}.globe{fill:url(#i-globe);stroke:#22d3ee;stroke-opacity:.55}.meridian{fill:none;stroke:#22d3ee;stroke-opacity:.65;stroke-width:1;transform-origin:520px 151px;animation:i-spin 7s linear infinite}.meter{fill:#22d3ee;transform-box:fill-box;transform-origin:left;animation:i-meter 2s ease-in-out infinite alternate}.pulse{fill:none;stroke:#22d3ee;stroke-opacity:.55;animation:i-pulse 2s ease-out infinite}@keyframes i-dash{to{stroke-dashoffset:-84}}@keyframes i-blink{to{opacity:.25}}@keyframes i-spin{to{transform:rotateY(360deg) rotate(360deg)}}@keyframes i-meter{to{transform:scaleX(.48)}}@keyframes i-pulse{0%{r:12;opacity:.8}100%{r:32;opacity:0}}@media(prefers-reduced-motion:reduce){.wire,.particle,.meridian,.meter,.pulse{animation:none}}
</style>
<rect width="1100" height="330" rx="18" fill="url(#i-bg)"/><g opacity=".08" stroke="#67e8f9"><path d="M0 60H1100M0 120H1100M0 180H1100M0 240H1100M0 300H1100M100 0V330M200 0V330M300 0V330M400 0V330M500 0V330M600 0V330M700 0V330M800 0V330M900 0V330M1000 0V330"/></g>
<text x="26" y="30" class="k">WINDOWS DESKTOP • VOICE • SYSTEM UTILITIES</text><text x="26" y="62" class="t">ILLI OS — Robotic Neural HUD</text>
<rect x="26" y="91" width="200" height="68" rx="10" class="panel"/><text x="42" y="116" class="small">01 / COMMAND</text><text x="42" y="140" class="label">Voice or GUI Input</text>
<path d="M226 125H275" class="wire"/><circle r="4" class="particle"><animateMotion dur="2s" repeatCount="indefinite" path="M226 125H275"/></circle>
<rect x="277" y="91" width="200" height="68" rx="10" class="panel"/><text x="293" y="116" class="small">02 / INTERFACE</text><text x="293" y="140" class="label">Tkinter Command HUD</text>
<path d="M477 125H500" class="wire"/>
<circle cx="550" cy="147" r="48" class="globe"/><ellipse cx="550" cy="147" rx="22" ry="48" class="meridian"/><ellipse cx="550" cy="147" rx="48" ry="17" class="meridian"/><ellipse cx="550" cy="147" rx="36" ry="48" class="meridian" opacity=".55"/><circle cx="550" cy="147" r="13" class="pulse"/><circle cx="550" cy="147" r="4" fill="#a5f3fc"/><g fill="#67e8f9"><circle cx="519" cy="118" r="2.5" class="particle"/><circle cx="581" cy="132" r="2" class="particle"/><circle cx="536" cy="184" r="2" class="particle"/><circle cx="591" cy="164" r="2" class="particle"/><circle cx="513" cy="153" r="2" class="particle"/><circle cx="565" cy="105" r="2" class="particle"/></g><text x="550" y="211" text-anchor="middle" class="small">NEURAL HUD / VISUAL</text>
<path d="M600 125H625" class="wire"/><rect x="627" y="91" width="200" height="68" rx="10" class="panel"/><text x="643" y="116" class="small">03 / EXECUTION</text><text x="643" y="140" class="label">System + App Tools</text>
<path d="M827 125H876" class="wire"/><circle r="4" class="particle"><animateMotion dur="2s" begin=".7s" repeatCount="indefinite" path="M827 125H876"/></circle>
<rect x="878" y="91" width="196" height="68" rx="10" class="panel"/><text x="894" y="116" class="small">04 / FEEDBACK</text><text x="894" y="140" class="label">GUI / Voice Output</text>
<text x="26" y="202" class="k">LIVE-STYLE TELEMETRY — DECORATIVE VISUALIZATION</text>
<g><text x="26" y="230" class="small">CPU</text><rect x="78" y="218" width="230" height="12" rx="6" fill="#123b4a"/><rect x="78" y="218" width="150" height="12" rx="6" class="meter"/><text x="26" y="257" class="small">RAM</text><rect x="78" y="245" width="230" height="12" rx="6" fill="#123b4a"/><rect x="78" y="245" width="185" height="12" rx="6" class="meter" style="animation-delay:.5s"/><text x="26" y="284" class="small">NET</text><rect x="78" y="272" width="230" height="12" rx="6" fill="#123b4a"/><rect x="78" y="272" width="110" height="12" rx="6" class="meter" style="animation-delay:1s"/></g>
<text x="360" y="246" class="muted">The animated meters and particle globe are visual accents,</text><text x="360" y="266" class="muted">not live measurements from your computer.</text><text x="360" y="305" class="small">COMMAND → INTERFACE → TOOL ACTION → RESPONSE</text><rect x=".5" y=".5" width="1099" height="329" rx="17.5" fill="none" stroke="#20556a"/>
</svg>