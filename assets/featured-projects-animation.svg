<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Interactive project systems visualization</title>
<desc id="desc">Animated project showcase illustrating GYRUS voice assistant, ILLI desktop assistant, phishing URL classification, FlowForge n8n automation, machine learning research and a Python package.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080f1d"/><stop offset=".55" stop-color="#101b35"/><stop offset="1" stop-color="#091b2b"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<style>
 .heading{font:700 24px 'Segoe UI',Arial,sans-serif;fill:#f1f5ff}.sub{font:13px 'Segoe UI',Arial,sans-serif;fill:#9fb0d0}.tag{font:700 10px 'Segoe UI',Arial,sans-serif;letter-spacing:1.7px;fill:#9eb4d9}.cardtitle{font:700 16px 'Segoe UI',Arial,sans-serif;fill:#eef2ff}.desc{font:12px 'Segoe UI',Arial,sans-serif;fill:#9eafd0}.mono{font:10px Consolas,monospace;fill:#94a8cd}
 .card{fill:#0d1729;stroke:#283b5e;stroke-width:1}.node{fill:#101d34;stroke:#3a4c73;stroke-width:1}.link{stroke:#536a9e;stroke-width:1.2;stroke-dasharray:4 7;fill:none;animation:dash 6s linear infinite}.packet{animation:travel 3.8s linear infinite}.packet2{animation:travel 4.4s linear infinite;animation-delay:-1.6s}.pulse{animation:pulse 2.8s ease-in-out infinite;transform-origin:center}.float{animation:float 4s ease-in-out infinite}.float2{animation:float 4.8s ease-in-out infinite;animation-delay:-2s}
 @keyframes dash{to{stroke-dashoffset:-88}}@keyframes travel{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(200px);opacity:0}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
 @media(prefers-reduced-motion:reduce){.link,.packet,.packet2,.pulse,.float,.float2{animation:none}}
</style>
<rect width="1200" height="520" rx="22" fill="url(#bg)"/>
<g opacity=".14" stroke="#5b7098" stroke-width=".7"><path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200M0 420H1200M0 490H1200M100 0V520M200 0V520M300 0V520M400 0V520M500 0V520M600 0V520M700 0V520M800 0V520M900 0V520M1000 0V520M1100 0V520"/></g>
<text x="38" y="45" class="tag" fill="#67e8f9">PROJECT SYSTEMS / LIVE CONCEPT MAP</text><text x="38" y="78" class="heading">From ideas to working systems.</text><text x="38" y="101" class="sub">A visual overview of the projects I build, test and improve.</text>
<g opacity=".18" filter="url(#glow)"><circle cx="600" cy="275" r="70" fill="#8b5cf6"/></g>
<!-- connections -->
<path d="M600 260L210 188M600 260L600 188M600 260L990 188M600 290L210 382M600 290L600 382M600 290L990 382" class="link"/>
<path d="M600 260L210 188M600 260L600 188M600 260L990 188M600 290L210 382M600 290L600 382M600 290L990 382" class="link" stroke="#22d3ee" stroke-dasharray="2 22"/>
<!-- cards -->
<g class="float"><rect x="38" y="125" width="344" height="126" rx="14" class="card"/><rect x="38" y="125" width="4" height="126" rx="2" fill="#a78bfa"/><text x="60" y="150" class="tag" fill="#c4b5fd">01 / AI AGENT</text><text x="60" y="179" class="cardtitle">GYRUS — Voice &amp; Text</text><text x="60" y="201" class="desc">Input → intent → assistant actions</text><g transform="translate(302 169)"><circle r="25" fill="#8b5cf6" opacity=".13"/><circle r="17" fill="none" stroke="#a78bfa" stroke-width="1.5"/><path d="M-3 -8v16M3 -12v24M-9 -4v8M9 -6v12" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" class="pulse"/></g><text x="60" y="231" class="mono">VOICE / TEXT / PRODUCTIVITY</text></g>
<g class="float2"><rect x="428" y="125" width="344" height="126" rx="14" class="card"/><rect x="428" y="125" width="4" height="126" rx="2" fill="#22d3ee"/><text x="450" y="150" class="tag" fill="#67e8f9">02 / DESKTOP ASSISTANT</text><text x="450" y="179" class="cardtitle">ILLI — Desktop Workflows</text><text x="450" y="201" class="desc">Voice controls + local utilities</text><g transform="translate(697 168)"><rect x="-25" y="-18" width="50" height="35" rx="5" fill="#0b2638" stroke="#22d3ee"/><path d="M-16 -8h31M-16 0h22M-16 8h12" stroke="#67e8f9" stroke-width="2" stroke-linecap="round"/><circle cx="17" cy="-11" r="3" fill="#34d399"/></g><text x="450" y="231" class="mono">DESKTOP / VOICE / SYSTEM TOOLS</text></g>
<g class="float"><rect x="818" y="125" width="344" height="126" rx="14" class="card"/><rect x="818" y="125" width="4" height="126" rx="2" fill="#fb7185"/><text x="840" y="150" class="tag" fill="#fda4af">03 / SECURITY ML</text><text x="840" y="179" class="cardtitle">Phishing URL Detector</text><text x="840" y="201" class="desc">URL features → model → risk signal</text><g transform="translate(1080 170)"><path d="M0 -25L22 -16V1Q18 16 0 25Q-18 16 -22 1V-16Z" fill="#fb7185" fill-opacity=".13" stroke="#fb7185"/><path d="M-9 0l6 6 12 -13" fill="none" stroke="#fda4af" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="840" y="231" class="mono">FEATURES / CLASSIFICATION / EVALUATION</text></g>
<g class="float2"><rect x="38" y="300" width="344" height="126" rx="14" class="card"/><rect x="38" y="300" width="4" height="126" rx="2" fill="#34d399"/><text x="60" y="325" class="tag" fill="#6ee7b7">04 / WORKFLOW AUTOMATION</text><text x="60" y="354" class="cardtitle">FlowForge-AI — n8n</text><text x="60" y="376" class="desc">Trigger → transform → route → deliver</text><g transform="translate(303 358)"><rect x="-28" y="-19" width="19" height="17" rx="4" fill="#34d399" fill-opacity=".2" stroke="#34d399"/><rect x="9" y="-19" width="19" height="17" rx="4" fill="#34d399" fill-opacity=".2" stroke="#34d399"/><rect x="-10" y="8" width="20" height="17" rx="4" fill="#34d399" fill-opacity=".2" stroke="#34d399"/><path d="M-9 -10H9M0 -2V8" stroke="#6ee7b7" stroke-width="1.5"/></g><text x="60" y="406" class="mono">20 WORKFLOW TEMPLATES / JSON EXPORTS</text></g>
<g class="float"><rect x="428" y="300" width="344" height="126" rx="14" class="card"/><rect x="428" y="300" width="4" height="126" rx="2" fill="#fbbf24"/><text x="450" y="325" class="tag" fill="#fcd34d">05 / APPLIED ML</text><text x="450" y="354" class="cardtitle">Galaxy / Star / Quasar</text><text x="450" y="376" class="desc">Astronomy data → features → classifier</text><g transform="translate(700 358)"><circle r="22" fill="#fbbf24" fill-opacity=".08"/><circle r="3" fill="#fde68a"/><circle cx="-14" cy="-9" r="2" fill="#fbbf24"/><circle cx="13" cy="-12" r="2" fill="#67e8f9"/><circle cx="15" cy="10" r="2" fill="#a78bfa"/><circle cx="-11" cy="14" r="2" fill="#34d399"/><path d="M-14 -9L0 0L13 -12M0 0L15 10M0 0L-11 14" stroke="#7186b1" stroke-width="1"/></g><text x="450" y="406" class="mono">SDSS DR16 / RANDOM FOREST</text></g>
<g class="float2"><rect x="818" y="300" width="344" height="126" rx="14" class="card"/><rect x="818" y="300" width="4" height="126" rx="2" fill="#60a5fa"/><text x="840" y="325" class="tag" fill="#93c5fd">06 / PYTHON PACKAGE</text><text x="840" y="354" class="cardtitle">illi-ai-professional</text><text x="840" y="376" class="desc">Reusable package → install → build</text><g transform="translate(1080 358)"><path d="M-22 -15L0 -27L22 -15L0 -3Z" fill="#60a5fa" fill-opacity=".2" stroke="#93c5fd"/><path d="M-22 -15V10L0 23V-3M22 -15V10L0 23" fill="none" stroke="#93c5fd" stroke-width="1.5"/><path d="M-10 -9L0 -15L10 -9" fill="none" stroke="#bfdbfe"/></g><text x="840" y="406" class="mono">PYPI / LOCAL-FIRST ASSISTANT</text></g>
<!-- flow packets -->
<circle class="packet" cx="210" cy="188" r="4" fill="#c4b5fd"/><circle class="packet2" cx="600" cy="188" r="4" fill="#67e8f9"/><circle class="packet" cx="990" cy="188" r="4" fill="#fda4af"/><circle class="packet2" cx="210" cy="382" r="4" fill="#6ee7b7"/><circle class="packet" cx="600" cy="382" r="4" fill="#fde68a"/><circle class="packet2" cx="990" cy="382" r="4" fill="#93c5fd"/>
<rect x="38" y="458" width="1124" height="34" rx="9" fill="#0b1425" stroke="#263957"/><circle cx="58" cy="475" r="4" fill="#34d399" class="pulse"/><text x="72" y="479" class="mono">CONCEPTUAL PROJECT FLOW — details and execution depend on each repository</text><text x="1140" y="479" text-anchor="end" class="mono">BUILD / TEST / ITERATE</text>
<rect x=".5" y=".5" width="1199" height="519" rx="21.5" fill="none" stroke="#304365"/>
</svg>