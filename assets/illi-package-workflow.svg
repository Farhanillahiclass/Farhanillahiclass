<svg xmlns="http://www.w3.org/2000/svg" width="900" height="245" viewBox="0 0 900 245" role="img" aria-labelledby="t d">
<title id="t">illi-ai-professional workflow visualization</title><desc id="d">Conceptual animated flow: INSTALL PACKAGE to TKINTER / SPEECH to LOCAL AUTOMATION. Based on profile description; package internals not inspected.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#111a32"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5"/></filter></defs>
<style>.k{font:700 10px Arial,sans-serif;letter-spacing:2px;fill:#60a5fa}.h{font:700 21px Arial,sans-serif;fill:#f1f5ff}.s{font:12px Arial,sans-serif;fill:#a7b5d0}.n{font:700 12px Arial,sans-serif;fill:#e5edff}.m{font:10px Consolas,monospace;fill:#94a8c9}.path{stroke:#60a5fa;stroke-width:1.5;stroke-dasharray:5 7;fill:none;animation:dash 5s linear infinite}.pkt{fill:#60a5fa;animation:move 3s linear infinite}.box{fill:#101c30;stroke:#344766}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-72}}@keyframes move{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(190px);opacity:0}}@keyframes pulse{50%{opacity:.5}}@media(prefers-reduced-motion:reduce){.path,.pkt,.pulse{animation:none}}</style>
<rect width="900" height="245" rx="16" fill="url(#bg)"/><g opacity=".12" stroke="#6c82a8"><path d="M0 50H900M0 100H900M0 150H900M0 200H900M100 0V245M200 0V245M300 0V245M400 0V245M500 0V245M600 0V245M700 0V245M800 0V245"/></g>
<text x="25" y="28" class="k">PYTHON PACKAGE FLOW</text><text x="25" y="57" class="h">illi-ai-professional</text>
<g><rect x="25" y="91" width="250" height="77" rx="11" class="box"/><rect x="25" y="91" width="4" height="77" rx="2" fill="#60a5fa"/><text x="43" y="112" class="m">STAGE 01</text><text x="43" y="139" class="n">INSTALL PACKAGE</text><circle cx="247" cy="129" r="6" fill="#60a5fa" opacity=".17"/><circle cx="247" cy="129" r="3" fill="#60a5fa" class="pulse"/></g><path d="M275 130H311" class="path"/><circle cx="275" cy="130" r="3" class="pkt"/><g><rect x="315" y="91" width="250" height="77" rx="11" class="box"/><rect x="315" y="91" width="4" height="77" rx="2" fill="#60a5fa"/><text x="333" y="112" class="m">STAGE 02</text><text x="333" y="139" class="n">TKINTER / SPEECH</text><circle cx="537" cy="129" r="6" fill="#60a5fa" opacity=".17"/><circle cx="537" cy="129" r="3" fill="#60a5fa" class="pulse"/></g><path d="M565 130H601" class="path"/><circle cx="565" cy="130" r="3" class="pkt"/><g><rect x="605" y="91" width="250" height="77" rx="11" class="box"/><rect x="605" y="91" width="4" height="77" rx="2" fill="#60a5fa"/><text x="623" y="112" class="m">STAGE 03</text><text x="623" y="139" class="n">LOCAL AUTOMATION</text><circle cx="827" cy="129" r="6" fill="#60a5fa" opacity=".17"/><circle cx="827" cy="129" r="3" fill="#60a5fa" class="pulse"/></g>
<text x="25" y="197" class="s">Based on profile description; package internals not inspected</text><text x="25" y="222" class="m">INPUT → PROCESS → OUTPUT</text><rect x=".5" y=".5" width="899" height="244" rx="15.5" fill="none" stroke="#2c3d5a"/></svg>